[workspace]
resolver = "2"
members = [
    "crates/xet-local",
    "crates/transport",
    "crates/transport-quic",
    "crates/transport-tcp",
    "crates/transfer",
    "crates/providers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Upstream Xet, pinned together (see docs/UPSTREAM_AUDIT.md).
xet-runtime = "=1.8.0"
xet-core-structures = "=1.8.0"
xet-client = "=1.8.0"
xet-data = "=1.8.0"

anyhow = "1"
async-trait = "0.1"
ciborium = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
redb = "=3.1.3" # same as upstream xet-client, so one copy is built
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
libc = "0.2"
lz4_flex = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time", "io-util", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

xet-local = { path = "crates/xet-local" }
transport = { path = "crates/transport" }
transport-quic = { path = "crates/transport-quic" }
transport-tcp = { path = "crates/transport-tcp" }
providers = { path = "crates/providers" }
transfer = { path = "crates/transfer" }

# Chunking/hashing/compression are slow unoptimised; keep tests on large inputs fast.
# Line tables only (backtraces keep file:line): full debug info made target/debug ~6 GB, too
# big to keep between builds on this machine, which forced a full rebuild every cycle.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Release speed with symbols and line tables, for the built-in CPU profiler (`--features cpu-profile`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
