[workspace]
resolver = "2"
members = ["crates/xet-local", "crates/transport-quic", "crates/transfer", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Upstream Xet, pinned together (see docs/UPSTREAM_AUDIT.md).
xet-runtime = "=1.8.0"
xet-core-structures = "=1.8.0"
xet-client = "=1.8.0"
xet-data = "=1.8.0"

anyhow = "1"
ciborium = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

xet-local = { path = "crates/xet-local" }
transport-quic = { path = "crates/transport-quic" }
transfer = { path = "crates/transfer" }

# Chunking/hashing/compression are slow unoptimised; keep tests on large inputs fast.
[profile.dev.package."*"]
opt-level = 2
